<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Proyecto</title>
  <link rel="stylesheet" href="./Css/styles.css">
  <style>
    .project-grid {
      display: flex;
      gap: 20px;
      padding: 20px 0;
      flex-wrap: wrap;
    }
    .project-card {
      border: 1px solid var(--border-mid, #ccc);
      border-radius: 8px;
      width: 250px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-dark, #000);
      background: var(--surface, #fff);
      text-align: center;
    }
    .empty-card {
      border: 1px dashed var(--border-mid, #ccc);
      background: transparent;
    }
  </style>
</head>
<body style="background: var(--bg-main, #f5f5f5); padding: 40px;">
  
  <h1>Seleccionar Proyecto</h1>
  
  <div class="project-grid">
    <!-- Proyecto activo -->
    <a href="learn.html" class="project-card">
      <h2>Cómo hacer una casa</h2>
    </a>
    
    <!-- Tarjetas vacías (placeholders) -->
    <div class="project-card empty-card"></div>
    <div class="project-card empty-card"></div>
    <div class="project-card empty-card"></div>
    <div class="project-card empty-card"></div>
  </div>

</body>
</html>
